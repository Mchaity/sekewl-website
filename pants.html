<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeKewl Pants | SeKewl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f5f0eb;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .serif-title {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            font-style: italic;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-[#f5f0eb]/90 backdrop-blur-md px-6 py-4 flex items-center justify-between border-b border-black/5">
        <div class="flex items-center space-x-4">
            <button aria-label="Search" class="p-1 text-gray-800 hover:opacity-75">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </button>
            <a href="products.html" class="flex items-center space-x-1.5 text-gray-800 font-medium text-sm hover:opacity-75 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
            </a>
        </div>

        <a href="index.html" class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center">
            <img src="SeKewl Logo.png" alt="SeKewl Logo" class="h-8 w-auto object-contain">
        </a>

        <div class="flex items-center space-x-4">
            <button aria-label="Account" class="p-1 text-gray-800 hover:opacity-75">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </button>
            <button aria-label="Cart" class="p-1 text-gray-800 hover:opacity-75">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-xl mx-auto px-5 py-8 space-y-8 w-full">
        <section class="bg-white/60 p-6 rounded-3xl backdrop-blur-sm border border-black/5 space-y-6">
            
            <!-- Product Image & Switcher Gallery -->
            <div class="space-y-3">
                <div class="rounded-xl overflow-hidden aspect-[4/4] bg-stone-200">
                    <img id="main-product-img" 
                         src="Model 1.png" 
                         alt="SeKewl Pants Model View" 
                         class="w-full h-full object-cover transition duration-300">
                </div>

            <div class="flex gap-2 justify-center">
                <button onclick="switchImage(this, 'Model 1.png')" class="thumb-btn w-16 h-16 rounded-lg overflow-hidden border-2 border-black bg-stone-200">
                    <img src="Model 1.png" class="w-full h-full object-contain" alt="Model View">
                </button>
                <button onclick="switchImage(this, 'Invisible Mannequin.png')" class="thumb-btn w-16 h-16 rounded-lg overflow-hidden border-2 border-transparent bg-stone-200">
                    <img src="Invisible Mannequin.png" class="w-full h-full object-contain" alt="Mannequin View">
                </button>
            </div>


            <!-- Title & Price -->
            <div>
                <h2 class="text-2xl font-bold text-gray-900">SeKewl Pants</h2>
                <p class="text-lg font-medium text-gray-700 mt-1">R 599.00</p>
            </div>

            <!-- Color Options -->
            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Color: <span id="selected-color" class="font-normal text-gray-600">Grey</span></label>
                <div class="flex gap-2">
                    <button onclick="setColor('Grey')" class="px-4 py-2 border border-black/20 rounded-lg text-sm font-medium hover:border-black bg-white text-gray-900">Grey</button>
                    
                    <div class="relative flex-1">
                        <button disabled class="w-full px-4 py-2 border border-black/5 bg-gray-100 rounded-lg text-xs text-gray-400 cursor-not-allowed flex flex-col items-center justify-center">
                            <span>Navy</span>
                            <span class="text-[9px] uppercase tracking-wider text-gray-400 font-medium">Coming soon</span>
                        </button>
                    </div>

                    <div class="relative flex-1">
                        <button disabled class="w-full px-4 py-2 border border-black/5 bg-gray-100 rounded-lg text-xs text-gray-400 cursor-not-allowed flex flex-col items-center justify-center">
                            <span>Black</span>
                            <span class="text-[9px] uppercase tracking-wider text-gray-400 font-medium">Coming soon</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Size Options -->
            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Size</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="selectSize(this)" class="size-btn py-3 border border-black rounded-lg text-sm font-bold bg-black text-white">S</button>
                    <button onclick="selectSize(this)" class="size-btn py-3 border border-black/10 rounded-lg text-sm font-semibold bg-white text-gray-900 hover:border-black">M</button>
                    <button onclick="selectSize(this)" class="size-btn py-3 border border-black/10 rounded-lg text-sm font-semibold bg-white text-gray-900 hover:border-black">L</button>
                    <button onclick="selectSize(this)" class="size-btn py-3 border border-black/10 rounded-lg text-sm font-semibold bg-white text-gray-900 hover:border-black">XL</button>
                </div>
            </div>

            <!-- Quantity & Action Buttons -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center border border-black/10 rounded-xl w-32 bg-white overflow-hidden">
                    <button onclick="updateQty(-1)" class="px-4 py-2.5 text-gray-600 hover:bg-gray-100 transition">-</button>
                    <span id="qty-val" class="flex-1 text-center font-medium text-sm">1</span>
                    <button onclick="updateQty(1)" class="px-4 py-2.5 text-gray-600 hover:bg-gray-100 transition">+</button>
                </div>

                <button onclick="sendWhatsAppOrder()" class="w-full bg-black text-white py-4 rounded-xl font-medium hover:bg-gray-800 transition shadow-sm">
                    Add to cart
                </button>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-stone-100 text-gray-900 py-4 rounded-xl font-medium hover:bg-stone-200 transition border border-black/5">
                    Buy it now
                </button>
            </div>

        </section>
    </main>

    <!-- Footer Ribbon -->
    <footer class="text-center py-8 text-xs text-gray-500 border-t border-black/5 mt-12 space-y-2">
        <div class="flex justify-center space-x-4">
            <a href="#" class="hover:underline">Terms and Policies</a>
        </div>
    </footer>

    <!-- Interactive Script -->
    <script>
        let selectedColor = 'Grey';
        let selectedSize = 'S';
        let currentQty = 1;

        function setColor(color) {
            selectedColor = color;
            document.getElementById('selected-color').innerText = color;
        }

        function selectSize(btn) {
            document.querySelectorAll('.size-btn').forEach(b => {
                b.className = 'size-btn py-3 border border-black/10 rounded-lg text-sm font-semibold bg-white text-gray-900 hover:border-black';
            });
            btn.className = 'size-btn py-3 border border-black rounded-lg text-sm font-bold bg-black text-white';
            selectedSize = btn.innerText;
        } 

        function updateQty(delta) {
            currentQty = Math.max(1, currentQty + delta);
            document.getElementById('qty-val').innerText = currentQty;
        }

        function sendWhatsAppOrder() {
            const message = encodeURIComponent(`Hi SeKewl, I would like to order:\n- Item: SeKewl Pants\n- Quantity: ${currentQty}\n- Color: ${selectedColor}\n- Size: ${selectedSize}\n- Price: R 599.00 each`);
            window.open(`https://wa.me/?text=${message}`, '_blank');
        }

        function switchImage(button, imageUrl) {
            document.getElementById('main-product-img').src = imageUrl;

            document.querySelectorAll('.thumb-btn').forEach(btn => {
                btn.classList.remove('border-black');
                btn.classList.add('border-transparent');
            });
            button.classList.remove('border-transparent');
            button.classList.add('border-black');
        }
    </script>
</body>
</html>
